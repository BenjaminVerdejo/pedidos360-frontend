# Pipeline DevSecOps de Pedidos360 Frontend (EP5 - ISY1102)
#
#  push / PR ──► [1] Pruebas unitarias + cobertura (Vitest) + build de produccion
#           ├──► [2] SCA      (npm audit + Trivy)
#           ├──► [3] SAST     (Semgrep reglas propias + comunidad; CodeQL en codeql.yml)
#           ├──► [4] Secretos (Gitleaks)
#           └──► [5] Contenedor + DAST (Hadolint, Trivy imagen, cabeceras HTTP, OWASP ZAP)
#  Quality gate: falla con pruebas rojas, vulnerabilidades HIGH/CRITICAL en dependencias,
#  hallazgos SAST de severidad ERROR, secretos o cabeceras de seguridad ausentes.
name: CI Seguridad y Calidad

on:
  push:
    branches: [main, master, "ep*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: "[1] Pruebas automatizadas + build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pruebas unitarias con cobertura (Vitest)
        run: npm run test:ci | tee resultado-pruebas.txt
      - name: Resumen de cobertura
        if: always()
        run: |
          echo "### Pruebas y cobertura frontend" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "Test Files|Tests|Statements|Branches|Functions|Lines" resultado-pruebas.txt | sed 's/\x1b\[[0-9;]*m//g' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Build de produccion
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-cobertura
          path: |
            resultado-pruebas.txt
            coverage/

  sca:
    name: "[2] SCA - dependencias npm"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Reporte npm audit
        run: npm audit --json > npm-audit.json || true
      - name: Trivy (dependencias)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          format: table
          output: trivy-dependencias.txt
          exit-code: "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca
          path: |
            npm-audit.json
            trivy-dependencias.txt
      - name: Quality gate (sin vulnerabilidades HIGH o CRITICAL)
        run: npm audit --audit-level=high

  sast:
    name: "[3] SAST - Semgrep"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Analisis completo (SARIF)
        run: |
          semgrep scan --metrics=off --config p/typescript --config p/javascript --config p/secrets \
            --config p/owasp-top-ten --config .semgrep --sarif --output semgrep.sarif src || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-semgrep
          path: semgrep.sarif
      - name: Quality gate (severidad ERROR)
        run: semgrep scan --metrics=off --config .semgrep --config p/typescript --severity ERROR --error src

  secretos:
    name: "[4] Secretos - Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
      - run: ./gitleaks detect --source . --redact --verbose --report-format json --report-path gitleaks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secretos-gitleaks
          path: gitleaks.json

  contenedor-dast:
    name: "[5] Contenedor + DAST"
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - name: Construir imagen
        run: docker build -t pedidos360/frontend:${{ github.sha }} .
      - name: Escanear imagen (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pedidos360/frontend:${{ github.sha }}
          format: table
          output: trivy-imagen.txt
          exit-code: "0"
      - name: Levantar frontend
        run: |
          docker run -d --name frontend -p 8080:8080 --read-only --tmpfs /tmp pedidos360/frontend:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs http://localhost:8080 > /dev/null && break; sleep 2; done
      - name: Verificar cabeceras de seguridad HTTP
        run: bash scripts/verificar-cabeceras.sh http://localhost:8080 | tee cabeceras.md
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contenedor-dast
          path: |
            trivy-imagen.txt
            cabeceras.md
      - name: Quality gate imagen (CRITICAL con parche)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pedidos360/frontend:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
